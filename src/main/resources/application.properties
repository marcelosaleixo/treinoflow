spring.application.name=TreinoFlow

# PostgreSQL: configure as variáveis no ambiente (EasyPanel/local).
# Prioridade: SPRING_DATASOURCE_* padrão do Spring; depois DB_* legado.
# Não mantenha URL, usuário ou senha reais versionados no repositório.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://72.60.59.55:5432/treinoflow}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${POSTGRES_USER:postgres}}}
# A senha deve ser definida no serviço da aplicação no EasyPanel.
# Aceita os nomes padrão do Spring, os nomes legados DB_* e POSTGRES_PASSWORD.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:@aleixoPr0}}}
spring.datasource.driver-class-name=org.postgresql.Driver
# Permite ao Hibernate conhecer o dialeto mesmo se a conexão falhar.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Timeout explícito para falhar mais rápido e facilitar o diagnóstico de rede/credenciais.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.initialization-fail-timeout=${DB_INITIALIZATION_FAIL_TIMEOUT:10000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${PORT:8080}

# Mercado Pago (Etapa 37) - nunca coloque credenciais reais no Git.
treinoflow.pagamento.mercadopago.access-token=${TREINOFLOW_MP_ACCESS_TOKEN:}
treinoflow.pagamento.mercadopago.notification-url=${TREINOFLOW_MP_NOTIFICATION_URL:}

# Automação de notificações financeiras (horário local da JVM).
treinoflow.notificacoes.cron=${TREINOFLOW_NOTIFICACOES_CRON:0 0 8 * * *}

# Etapa 39 - canais externos de notificação. Desativados por padrão.
treinoflow.notificacoes.email.enabled=${TREINOFLOW_EMAIL_ENABLED:false}
treinoflow.notificacoes.whatsapp.enabled=${TREINOFLOW_WHATSAPP_ENABLED:false}
treinoflow.notificacoes.entrega-cron=${TREINOFLOW_NOTIFICACOES_ENTREGA_CRON:0 */5 * * * *}
treinoflow.notificacoes.whatsapp.base-url=${TREINOFLOW_WHATSAPP_BASE_URL:}
treinoflow.notificacoes.whatsapp.api-key=${TREINOFLOW_WHATSAPP_API_KEY:}
treinoflow.notificacoes.whatsapp.instance=${TREINOFLOW_WHATSAPP_INSTANCE:}
treinoflow.notificacoes.whatsapp.endpoint=${TREINOFLOW_WHATSAPP_ENDPOINT:/message/sendText/{instance}}

# SMTP: use as propriedades spring.mail.* somente quando o e-mail estiver habilitado.
spring.mail.host=${TREINOFLOW_SMTP_HOST:}
spring.mail.port=${TREINOFLOW_SMTP_PORT:587}
spring.mail.username=${TREINOFLOW_SMTP_USERNAME:}
spring.mail.password=${TREINOFLOW_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${TREINOFLOW_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${TREINOFLOW_SMTP_STARTTLS:true}

# Etapa 49 - automação de retenção. Não envia WhatsApp; apenas cria follow-ups no CRM.
treinoflow.retencao.automacao-cron=${TREINOFLOW_RETENCAO_AUTOMACAO_CRON:0 15 8 * * *}

# Etapa 57 - confirmação do agendamento no Portal + lembretes WhatsApp.
treinoflow.app.base-url=${TREINOFLOW_APP_BASE_URL:}
treinoflow.agenda.lembretes-cron=${TREINOFLOW_AGENDA_LEMBRETES_CRON:0 */15 * * * *}

# Etapa 122 - geração automática de cobranças das mensalidades ativas.
treinoflow.financeiro.recorrencia-cron=${TREINOFLOW_FINANCEIRO_RECORRENCIA_CRON:0 0 7 * * *}

# Etapa 161 - limite controlado para importacao CSV de alunos.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Etapa 177 - alerta quando a proporção de linhas ignoradas/rejeitadas atingir o limite.
treinoflow.importacao.limite-problemas-percentual=${TREINOFLOW_IMPORTACAO_LIMITE_PROBLEMAS_PERCENTUAL:10}

# Etapa 187 - retenção do histórico de auditoria de preferências.
# Desativada por padrão: não excluir dados sem habilitação explícita do operador.
treinoflow.auditoria-preferencias.enabled=${TREINOFLOW_AUDITORIA_PREFERENCIAS_ENABLED:false}
treinoflow.auditoria-preferencias.retencao-dias=${TREINOFLOW_AUDITORIA_PREFERENCIAS_RETENCAO_DIAS:365}
treinoflow.auditoria-preferencias.cron=${TREINOFLOW_AUDITORIA_PREFERENCIAS_CRON:0 30 3 * * *}

# Etapa 189: alertas operacionais de notificações (limiar e janela)
treinoflow.notificacoes.alertas.limite-falhas-sse=${TREINOFLOW_ALERTAS_SSE_LIMITE_FALHAS:5}
treinoflow.notificacoes.alertas.janela-minutos=${TREINOFLOW_ALERTAS_SSE_JANELA_MINUTOS:10}

# Etapa 191 - e-mail de alertas operacionais (destinatário vazio desabilita os envios).
treinoflow.notificacoes.alertas.email.destino=${TREINOFLOW_ALERTAS_EMAIL_DESTINO:}

# Etapa 192 - fila persistente de e-mails de alertas operacionais.
treinoflow.notificacoes.alertas.email.max-tentativas=${TREINOFLOW_ALERTAS_EMAIL_MAX_TENTATIVAS:4}
treinoflow.notificacoes.alertas.email.intervalo-ms=${TREINOFLOW_ALERTAS_EMAIL_INTERVALO_MS:30000}


# Etapa 211 - health check minimo para monitoramento pos-implantacao.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
