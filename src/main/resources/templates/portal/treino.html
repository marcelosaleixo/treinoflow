<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${treino.nome} + ' | TreinoFlow'">Treino</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172554}.top{background:#172554;color:#fff;padding:20px}.wrap{max-width:980px;margin:0 auto;padding:24px 16px}.back{display:inline-block;margin-bottom:16px;color:#2563eb;text-decoration:none;font-weight:700}.hero,.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px #17255412;margin-bottom:18px}.hero{background:linear-gradient(135deg,#172554,#2563eb);color:#fff}.exercise{padding:18px 0;border-bottom:1px solid #e2e8f0}.exercise:last-child{border-bottom:0}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.tag{background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:6px 9px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}textarea{min-height:80px}.btn{border:0;cursor:pointer;padding:12px 16px;border-radius:10px;background:#2563eb;color:#fff;font-weight:700}.success{padding:12px;background:#dcfce7;color:#166534;border-radius:10px;margin-bottom:16px}.error{padding:12px;background:#fee2e2;color:#991b1b;border-radius:10px;margin-bottom:16px}.muted{color:#64748b}.tracking{margin-top:12px;padding:14px;background:#f8fafc;border-radius:12px}.tracking h4{margin:0 0 12px}.field{margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><strong>TreinoFlow</strong></header><main class="wrap"><a class="back" th:href="@{/portal/{token}(token=${token})}">← Voltar para meu portal</a><section class="hero"><h1 th:text="${treino.nome}">Treino</h1><p th:text="${treino.descricao ?: 'Treino personalizado'}"></p></section><div class="success" th:if="${sucesso}" th:text="${sucesso}"></div><div class="error" th:if="${erro}" th:text="${erro}"></div>
<section class="panel"><h2>Exercícios</h2><form method="post" th:action="@{/portal/{token}/treinos/{id}/concluir(token=${token},id=${treino.id})}">
<article class="exercise" th:each="item : ${exercicios}"><h3 th:text="${item.ordem + '. ' + item.exercicio.nome}">1. Agachamento</h3><div class="meta"><span class="tag" th:text="${item.series != null ? item.series + ' séries' : 'Séries conforme orientação'}"></span><span class="tag" th:text="${item.repeticoes ?: 'Repetições conforme orientação'}"></span><span class="tag" th:if="${item.carga != null and !item.carga.isBlank()}" th:text="${'Prescrição: ' + item.carga}"></span><span class="tag" th:if="${item.descansoSegundos != null}" th:text="${'Descanso: ' + item.descansoSegundos + 's'}"></span></div><p class="muted" th:if="${item.exercicio.descricao}" th:text="${item.exercicio.descricao}"></p><p th:if="${item.observacao}" th:text="'Orientação: ' + ${item.observacao}"></p><a th:if="${item.exercicio.urlVideo != null and !item.exercicio.urlVideo.isBlank()}" th:href="${item.exercicio.urlVideo}" target="_blank" rel="noopener">▶ Ver vídeo do exercício</a>
<div class="tracking"><h4>Registrar execução</h4><div class="grid"><div><label th:for="${'carga_' + item.id}">Carga realizada</label><input th:id="${'carga_' + item.id}" th:name="${'carga_' + item.id}" placeholder="Ex.: 40 kg"></div><div><label th:for="${'reps_' + item.id}">Repetições realizadas</label><input type="number" min="0" max="999" th:id="${'reps_' + item.id}" th:name="${'reps_' + item.id}" placeholder="Ex.: 12"></div></div><div class="field"><label th:for="${'obs_' + item.id}">Observação</label><textarea th:id="${'obs_' + item.id}" th:name="${'obs_' + item.id}" maxlength="500" placeholder="Como foi este exercício?"></textarea></div></div></article>
<div class="tracking"><h3>Como foi o treino?</h3><p class="muted">Registre sua avaliação e feedback para seu Personal acompanhar sua evolução.</p><div class="grid"><div><label for="nota">Nota do treino (1 a 5)</label><select id="nota" name="nota"><option value="">Não informar</option><option value="1">1 — Muito difícil</option><option value="2">2 — Difícil</option><option value="3">3 — Bom</option><option value="4">4 — Muito bom</option><option value="5">5 — Excelente</option></select></div><div><label for="feedback">Feedback geral</label><textarea id="feedback" name="feedback" maxlength="1000" placeholder="Como você se sentiu? Alguma dor ou dificuldade?"></textarea></div></div><button class="btn" type="submit" style="margin-top:14px">✓ Salvar execução e concluir treino</button></div></form></section></main></body></html>
