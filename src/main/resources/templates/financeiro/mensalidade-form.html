<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo plano | TreinoFlow</title><link rel="stylesheet" th:href="@{/css/treinoflow.css}"><link rel="stylesheet" th:href="@{/css/tf-header.css}"><style>body{margin:0;background:#f3f6fb;color:#172554;font-family:Inter,Arial,sans-serif}main{max-width:760px;margin:34px auto;padding:0 22px}.eyebrow{color:#2563eb;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.12em}h1{margin:8px 0}.intro{color:#64748b}.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:22px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:15px}label{display:block;font-size:13px;font-weight:700}input,select,textarea{width:100%;box-sizing:border-box;margin-top:7px;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#2563eb;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.secondary{background:#eff6ff;color:#1d4ed8}.hint{font-size:12px;color:#64748b;font-weight:400;margin-top:5px}@media(max-width:650px){main{margin:24px auto;padding:0 16px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions,.btn{width:100%;box-sizing:border-box;text-align:center}}
</style></head><body><div th:replace="~{fragments/tf-header :: header}"></div><main><div class="eyebrow">Financeiro</div><h1>Novo plano mensal</h1><p class="intro">Defina o valor e o dia de vencimento recorrente do aluno.</p><section class="card"><form th:action="@{/financeiro/mensalidades}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="grid"><label>Aluno<select name="alunoId" required><option value="">Selecione...</option><option th:each="a:${alunos}" th:value="${a.id}" th:text="${a.nome}"></option></select></label><label>Valor mensal<input name="valor" type="number" step="0.01" min="0.01" placeholder="300,00" required></label><label>Nome do plano<input name="nome" maxlength="120" placeholder="Personal mensal" required></label><label>Dia de vencimento<input name="diaVencimento" type="number" min="1" max="28" value="10" required><div class="hint">Use 1 a 28 para funcionar em todos os meses.</div></label><label>Data de início<input name="dataInicio" type="date" th:value="${hoje}" required></label><label class="full">Observação<textarea name="observacao" maxlength="500" placeholder="Ex.: 3 treinos por semana, acompanhamento presencial..."></textarea></label></div><div class="actions"><a class="btn secondary" th:href="@{/financeiro/mensalidades}">Cancelar</a><button class="btn" type="submit">Criar plano mensal</button></div></form></section></main></body></html>
