<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Master | TreinoFlow</title><style>body{margin:0;background:#f1f5f9;color:#172554;font:15px Arial}.wrap{max-width:1100px;margin:35px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:22px}.num{font-size:32px;font-weight:bold;margin-top:10px}.btn{display:inline-block;background:#2563eb;color:white;text-decoration:none;padding:11px 15px;border-radius:8px;margin:10px 8px 0 0}.muted{color:#64748b}</style></head><body><div th:replace="~{admin/base-fragment :: topo('Painel de administração')}"></div><main class="wrap"><h1>Administração da plataforma</h1><p class="muted">Gerencie os personais (contas/empresas), planos e status de acesso.</p><section class="cards"><article class="card">Personais cadastrados<div class="num" th:text="${totalPersonais}">0</div></article><article class="card">Contas ativas<div class="num" th:text="${personaisAtivos}">0</div></article><article class="card">Planos<div class="num" th:text="${totalPlanos}">0</div></article></section><a class="btn" th:href="@{/admin/personais}">Gerenciar personais</a><a class="btn" th:href="@{/admin/planos}">Gerenciar planos</a><section class="card" style="margin-top:22px"><h2>Cadastros recentes</h2><p th:if="${#lists.isEmpty(personaisRecentes)}">Nenhum personal cadastrado ainda.</p><table th:unless="${#lists.isEmpty(personaisRecentes)}" width="100%" cellpadding="10"><thead><tr><th align="left">Personal</th><th align="left">E-mail</th><th align="left">Plano</th><th align="left">Status</th></tr></thead><tbody><tr th:each="p:${personaisRecentes}"><td th:text="${p.nome}"></td><td th:text="${p.email}"></td><td th:text="${p.plano != null ? p.plano.nome : 'Sem plano'}"></td><td th:text="${p.ativo ? 'Ativo':'Inativo'}"></td></tr></tbody></table></section></main></body></html>
