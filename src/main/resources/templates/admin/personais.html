<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personais | TreinoFlow</title><style>body{margin:0;background:#f1f5f9;font:14px Arial;color:#172554}.wrap{max-width:1100px;margin:30px auto;padding:0 16px}.panel{background:white;padding:20px;border:1px solid #e2e8f0;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0;white-space:nowrap}.btn{display:inline-block;padding:10px 14px;background:#2563eb;color:white;border:0;border-radius:7px;text-decoration:none;cursor:pointer}.danger{background:#b91c1c}.success{color:#166534}.error{color:#b91c1c}</style></head><body><div th:replace="~{admin/base-fragment :: topo('Gestão de personais')}"></div><main class="wrap"><h1>Personais / empresas</h1><p class="success" th:if="${sucesso}" th:text="${sucesso}"></p><p class="error" th:if="${erro}" th:text="${erro}"></p><p><a class="btn" th:href="@{/admin/personais/novo}">+ Cadastrar personal</a></p><section class="panel"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Plano</th><th>Status</th><th>Assinatura</th><th>Cadastro</th><th>Ação</th></tr></thead><tbody><tr th:each="p:${personais}"><td th:text="${p.nome}"></td><td th:text="${p.email}"></td><td th:text="${p.telefone}"></td><td th:text="${p.plano != null ? p.plano.nome : 'Sem plano'}"></td><td th:text="${p.ativo ? 'Ativo':'Inativo'}"></td><td><a th:href="@{/admin/assinaturas/nova/{id}(id=${p.id})}">Gerenciar</a></td><td th:text="${#temporals.format(p.dataCriacao,'dd/MM/yyyy')}"></td><td><a th:href="@{/admin/personais/{id}/editar(id=${p.id})}">Editar</a> &nbsp; <form style="display:inline" th:action="@{/admin/personais/{id}/status(id=${p.id})}" method="post"><button class="btn" th:classappend="${p.ativo ? ' danger':''}" th:text="${p.ativo ? 'Desativar':'Ativar'}"></button></form></td></tr><tr th:if="${#lists.isEmpty(personais)}"><td colspan="8">Nenhum personal cadastrado.</td></tr></tbody></table></section></main></body></html>
