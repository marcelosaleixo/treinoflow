<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo personal</title><style>body{margin:0;background:#f1f5f9;font:15px Arial;color:#172554}.wrap{max-width:720px;margin:30px auto;padding:0 16px}.panel{background:white;padding:24px;border-radius:12px}label{display:block;font-weight:bold;margin:14px 0 6px}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;box-sizing:border-box}.btn{padding:11px 15px;background:#2563eb;color:white;border:0;border-radius:7px;margin-top:18px;cursor:pointer}.err{color:#b91c1c}</style></head><body><div th:replace="~{admin/base-fragment :: topo('Cadastro de personal')}"></div><main class="wrap"><section class="panel"><h1 th:text="${personal.id != null ? 'Editar personal' : 'Cadastrar personal'}">Cadastrar personal</h1><p>O personal representa uma conta/empresa dentro do SaaS.</p><p class="err" th:if="${erro}" th:text="${erro}"></p><form method="post" th:action="@{/admin/personais/salvar}"><input type="hidden" name="id" th:value="${personal.id}"><label>Nome completo / empresa</label><input name="nome" required maxlength="120" th:value="${personal.nome}"><label>E-mail de acesso</label><input name="email" type="email" required maxlength="150" th:value="${personal.email}"><label>Telefone</label><input name="telefone" maxlength="20" th:value="${personal.telefone}"><label>Senha inicial (mínimo 8 caracteres)</label><input name="senha" type="password" minlength="8" th:required="${personal.id == null}"><label>Plano</label><select name="planoId"><option value="">Sem plano</option><option th:each="pl:${planos}" th:value="${pl.id}" th:selected="${personal.plano != null and personal.plano.id == pl.id}" th:text="${pl.nome + ' — R$ ' + pl.valorMensal}"></option></select><button class="btn" type="submit">Salvar cadastro</button></form></section></main></body></html>
