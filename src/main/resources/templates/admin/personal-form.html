<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal | TreinoFlow</title>
<style>body{margin:0;background:#f1f5f9;font:14px Arial;color:#172554}.wrap{max-width:760px;margin:30px auto;padding:0 16px}.panel{background:#fff;padding:24px;border:1px solid #e2e8f0;border-radius:12px}label{display:block;font-weight:bold;margin:14px 0 6px}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;box-sizing:border-box;background:#fff}.btn{display:inline-block;padding:11px 15px;background:#2563eb;color:#fff;border:0;border-radius:7px;margin-top:18px;cursor:pointer}.err{color:#b91c1c}.hint{color:#64748b;font-size:13px;margin-top:6px}.badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:bold}</style></head>
<body><div th:replace="~{admin/base-fragment :: topo('Gestão de personais')}"></div>
<main class="wrap"><section class="panel"><h1 th:text="${personal.id != null ? 'Editar personal' : 'Cadastrar personal'}">Cadastrar personal</h1>
<p>O personal já recebe automaticamente o <strong>plano padrão</strong>, mas você pode escolher outro plano ativo antes de salvar.</p>
<p class="err" th:if="${erro}" th:text="${erro}"></p>
<form method="post" th:action="@{/admin/personais/salvar}">
<input type="hidden" name="id" th:value="${personal.id}">
<label>Nome completo / empresa</label><input name="nome" required maxlength="120" th:value="${personal.nome}">
<label>E-mail de acesso</label><input name="email" type="email" required maxlength="150" th:value="${personal.email}">
<label>Telefone</label><input name="telefone" maxlength="20" th:value="${personal.telefone}">
<label>Senha inicial (mínimo 8 caracteres)</label><input name="senha" type="password" minlength="8" th:required="${personal.id == null}">
<label>Plano comercial <span class="badge" th:if="${personal.id == null}">Padrão pré-selecionado</span></label>
<select name="planoId" required>
<option th:each="pl:${planos}" th:if="${pl.ativo}" th:value="${pl.id}" th:selected="${personal.plano != null and personal.plano.id == pl.id}" th:text="${pl.nome + ' — R$ ' + #numbers.formatDecimal(pl.valorMensal,1,2) + ' / ' + pl.limiteAlunos + ' alunos' + (pl.padrao ? ' · PADRÃO' : '')}"></option>
</select>
<p class="hint">O plano define o limite de alunos e já passa a valer imediatamente após o cadastro.</p>
<button class="btn" type="submit">Salvar cadastro</button>
</form></section></main></body></html>
