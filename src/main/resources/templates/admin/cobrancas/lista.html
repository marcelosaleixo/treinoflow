<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cobranças | TreinoFlow</title><style>body{margin:0;background:#f1f5f9;color:#172554;font:14px Arial}.wrap{max-width:1180px;margin:28px auto;padding:0 16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px}.num{font-size:26px;font-weight:700;margin-top:6px}.muted{color:#64748b}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;text-align:left;border-bottom:1px solid #e2e8f0;white-space:nowrap}.btn{border:0;background:#2563eb;color:#fff;padding:9px 12px;border-radius:7px;text-decoration:none;cursor:pointer}.btn.gray{background:#64748b}.btn.green{background:#15803d}.btn.red{background:#b91c1c}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{padding:5px 8px;border-radius:999px;background:#e2e8f0}.ok{color:#166534}.warn{color:#92400e}.bad{color:#b91c1c}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style></head><body><div th:replace="~{admin/base-fragment :: topo('Gestão de cobranças')}"></div><main class="wrap"><h1>Faturamento e cobranças</h1><p class="muted">Controle manual das cobranças mensais. Nenhum gateway de pagamento é utilizado nesta etapa.</p><form th:action="@{/admin/cobrancas/gerar}" method="post"><button class="btn" type="submit">Gerar cobranças do mês</button></form><div class="cards"><div class="card"><span class="muted">Pendentes</span><div class="num" th:text="${pendentes}">0</div></div><div class="card"><span class="muted">Atrasadas</span><div class="num bad" th:text="${atrasadas}">0</div></div><div class="card"><span class="muted">Pagas</span><div class="num ok" th:text="${pagas}">0</div></div><div class="card"><span class="muted">Recebido</span><div class="num" th:text="${'R$ ' + #numbers.formatDecimal(recebido,1,2)}">R$ 0,00</div></div></div><p class="ok" th:if="${sucesso}" th:text="${sucesso}"></p><section class="panel table"><table><thead><tr><th>Personal</th><th>Plano</th><th>Competência</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="c:${cobrancas}"><td th:text="${c.assinatura.personal.nome}"></td><td th:text="${c.assinatura.plano.nome}"></td><td th:text="${#temporals.format(c.competencia,'MM/yyyy')}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(c.valor,1,2)}"></td><td th:text="${#temporals.format(c.dataVencimento,'dd/MM/yyyy')}"></td><td><span class="badge" th:text="${c.status.descricao}"></span></td><td class="actions"><form th:if="${c.status.name() != 'PAGA' and c.status.name() != 'CANCELADA'}" th:action="@{/admin/cobrancas/{id}/pagar(id=${c.id})}" method="post"><button class="btn green" type="submit">Marcar paga</button></form><form th:if="${c.status.name() == 'PENDENTE' or c.status.name() == 'ATRASADA'}" th:action="@{/admin/cobrancas/{id}/cancelar(id=${c.id})}" method="post"><button class="btn red" type="submit">Cancelar</button></form></td></tr><tr th:if="${#lists.isEmpty(cobrancas)}"><td colspan="7">Nenhuma cobrança cadastrada. Gere as cobranças do mês.</td></tr></tbody></table></section></main></body></html>
