<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar | TreinoFlow</title><style>body{font-family:Arial,sans-serif;background:#f3f6fb;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;padding:32px;border-radius:16px;width:min(360px,calc(100% - 40px));box-shadow:0 8px 30px #17255412}h1{margin-top:0;color:#172554}label{display:block;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px}button{width:100%;margin-top:20px;padding:12px;background:#2563eb;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.muted{color:#64748b;font-size:14px}a{color:#2563eb}.notice{color:#166534}.error{color:#b91c1c}</style></head><body><main class="card"><h1>TreinoFlow</h1><p class="muted">Acesse sua conta de personal trainer.</p><p class="notice" th:if="${param.cadastroSucesso}">Cadastro realizado. Entre com seu e-mail e senha.</p><p class="notice" th:if="${param.logout}">Você saiu da sua conta.</p><p class="error" th:if="${param.error}">E-mail ou senha inválidos, ou conta inativa.</p><form th:action="@{/login}" method="post"><label for="username">E-mail</label><input id="username" name="username" type="email" autocomplete="username" required><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button></form><p class="muted">Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p></main></body></html>
