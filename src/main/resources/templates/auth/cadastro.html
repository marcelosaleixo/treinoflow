<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Criar conta | TreinoFlow</title><style>body{font-family:Arial,sans-serif;background:#f3f6fb;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px 0}.card{background:white;padding:30px;border-radius:16px;width:min(420px,calc(100% - 40px));box-shadow:0 8px 30px #17255412}h1{color:#172554;margin-top:0}label{display:block;margin:12px 0 5px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px}button{width:100%;margin-top:20px;padding:12px;background:#2563eb;color:white;border:0;border-radius:8px;font-weight:bold}a{color:#2563eb}.error{color:#b91c1c;font-size:14px}</style></head><body><main class="card"><h1>Criar conta</h1><p>Comece a organizar seus alunos e treinos.</p><p class="error" th:if="${erro}" th:text="${erro}"></p><form th:action="@{/cadastro}" th:object="${form}" method="post"><label for="nome">Nome</label><input id="nome" th:field="*{nome}" required maxlength="120"><small class="error" th:errors="*{nome}"></small><label for="email">E-mail</label><input id="email" type="email" th:field="*{email}" required maxlength="150"><small class="error" th:errors="*{email}"></small><label for="telefone">Telefone (opcional)</label><input id="telefone" th:field="*{telefone}" maxlength="20"><label for="senha">Senha (mínimo 8 caracteres)</label><input id="senha" type="password" th:field="*{senha}" required minlength="8" maxlength="72"><small class="error" th:errors="*{senha}"></small><label for="confirmarSenha">Confirmar senha</label><input id="confirmarSenha" type="password" th:field="*{confirmarSenha}" required><small class="error" th:errors="*{confirmarSenha}"></small><button type="submit">Criar minha conta</button></form><p>Já tem conta? <a th:href="@{/login}">Entrar</a></p></main></body></html>
