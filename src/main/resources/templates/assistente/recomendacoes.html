<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recomendações Adaptativas | TreinoFlow</title><link rel="stylesheet" th:href="@{/css/treinoflow.css}">
<style>body{margin:0;background:#f3f6fb;color:#172554;font-family:Inter,Arial,sans-serif}.top{background:#172554;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;border:1px solid #ffffff22;padding:8px 11px;border-radius:9px}.wrap{max-width:1100px;margin:28px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card,.item{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px}.num{font-size:28px;font-weight:800}.items{display:grid;gap:10px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800;background:#dcfce7;color:#166534}.low{background:#fef3c7;color:#92400e}.muted{color:#64748b;font-size:13px}.action{font-size:18px;font-weight:800;margin:8px 0}.reason{background:#eff6ff;border-radius:10px;padding:11px;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head>
<body><header class="top"><div><strong>TreinoFlow</strong><div th:text="${personal.nome}">Personal</div></div><nav class="nav"><a th:href="@{/inteligencia}">Central</a><a th:href="@{/assistente/acoes}">Assistente</a><a th:href="@{/assistente/resultados}">Resultados</a><a th:href="@{/assistente/aprendizado}">Aprendizado</a></nav></header>
<main class="wrap"><h1>Recomendações adaptativas</h1><p class="muted" th:text="${dashboard.periodo}">Histórico dos últimos 90 dias</p><p th:text="${dashboard.resumo}">Resumo</p>
<section class="grid"><div class="card"><div class="muted">Casos em risco</div><div class="num" th:text="${dashboard.casos}">0</div></div><div class="card"><div class="muted">Confiança alta</div><div class="num" th:text="${dashboard.recomendacoesAltaConfianca}">0</div></div><div class="card"><div class="muted">Amostra insuficiente</div><div class="num" th:text="${dashboard.recomendacoesBaixaConfianca}">0</div></div></section>
<section class="items"><article class="item" th:each="i : ${dashboard.itens}"><span class="badge" th:classappend="${i.confianca == 'BAIXA' ? ' low' : ''}" th:text="${i.nivel + ' · ' + i.confianca}">CRÍTICO · ALTA</span><div class="action" th:text="${i.acao}">WhatsApp</div><div class="reason" th:text="${i.justificativa}">Justificativa</div></article></section></main></body></html>
