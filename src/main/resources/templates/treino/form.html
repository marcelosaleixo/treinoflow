<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo treino | TreinoFlow</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172554;font-family:Arial,sans-serif}.wrap{max-width:700px;margin:35px auto;padding:0 18px}.panel{background:#fff;padding:24px;border-radius:14px;box-shadow:0 8px 30px #17255410}label{display:block;font-weight:bold;margin:15px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.btn{display:inline-block;padding:11px 15px;border:0;border-radius:8px;background:#2563eb;color:#fff;text-decoration:none;font-weight:bold;cursor:pointer;margin-top:16px}.msg{padding:12px;background:#fee2e2;color:#991b1b;border-radius:8px}</style></head><body><main class="wrap"><p><a th:href="@{/alunos/{id}/treinos(id=${aluno.id})}">← Voltar aos treinos</a></p><section class="panel"><h1>Novo treino</h1><p>Aluno: <strong th:text="${aluno.nome}"></strong></p><div th:if="${erro}" class="msg" th:text="${erro}"></div><form method="post" th:action="@{/alunos/{id}/treinos/salvar(id=${aluno.id})}" th:object="${treino}"><label for="nome">Nome do treino *</label><input id="nome" th:field="*{nome}" maxlength="80" required placeholder="Ex.: Treino A — Inferiores"><label for="descricao">Descrição / orientações</label><textarea id="descricao" th:field="*{descricao}" rows="4" placeholder="Objetivo, frequência ou observações"></textarea><button class="btn" type="submit">Salvar e adicionar exercícios</button></form></section></main></body></html>
