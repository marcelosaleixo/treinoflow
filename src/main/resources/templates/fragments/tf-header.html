<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="tf-header" th:fragment="header">
  <div class="tf-header-inner">
    <a class="tf-brand" th:href="@{/dashboard}" aria-label="TreinoFlow - Dashboard">TreinoFlow</a>
    <nav class="tf-nav" aria-label="Navegação principal">
      <a th:href="@{/dashboard}">Dashboard</a>
      <a th:href="@{/alunos}">Alunos</a>
      <a th:href="@{/agenda}">Agenda</a>
      <a th:href="@{/performance}">Performance</a>
      <a th:href="@{/crm}">CRM</a>
      <a th:href="@{/financeiro}">Financeiro</a>
      <a th:href="@{/notificacoes}" class="tf-nav-notificacoes" aria-label="Central de notificações" th:attr="aria-label=${notificacoesNaoLidasMenu > 0 ? 'Central de notificações, ' + notificacoesNaoLidasMenu + ' não lidas' : 'Central de notificações'}">
        <span>Notificações</span>
        <span class="tf-notificacoes-badge" data-notificacoes-badge
              th:classappend="${notificacoesNaoLidasMenu == 0} ? ' is-hidden' : ''"
              th:text="${notificacoesNaoLidasMenu > 99 ? '99+' : notificacoesNaoLidasMenu}"
              th:attr="aria-label=${notificacoesNaoLidasMenu + ' notificações não lidas'}"></span>
      </a>
      <a th:href="@{/retencao}">Retenção</a>
      <a th:href="@{/assistente/acoes}">Assistente</a>
      <a th:href="@{/exercicios}">Exercícios</a>
      <form th:action="@{/logout}" method="post">
        <button type="submit">Sair</button>
      </form>
    </nav>
  </div>
</header>
<script data-notificacoes-live-counter th:inline="javascript">
(function () {
  'use strict';
  var endpointContagem = /*[[@{/notificacoes/contagem-nao-lidas}]]*/ '/notificacoes/contagem-nao-lidas';
  var endpointEventos = /*[[@{/notificacoes/eventos}]]*/ '/notificacoes/eventos';
  var emConsulta = false;
  var fonte = null;

  function atualizarContador() {
    var link = document.querySelector('.tf-nav-notificacoes');
    if (emConsulta || !link) return;
    emConsulta = true;
    fetch(endpointContagem, {
      method: 'GET', credentials: 'same-origin', cache: 'no-store',
      headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }
    }).then(function (resposta) {
      if (!resposta.ok) throw new Error('Não foi possível consultar as notificações');
      return resposta.json();
    }).then(function (dados) {
      var total = Number(dados && dados.total);
      if (!Number.isFinite(total) || total < 0) return;
      total = Math.floor(total);
      var badge = link.querySelector('[data-notificacoes-badge]');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'tf-notificacoes-badge is-hidden';
        badge.setAttribute('data-notificacoes-badge', '');
        link.appendChild(badge);
      }
      badge.textContent = total > 99 ? '99+' : String(total);
      badge.classList.toggle('is-hidden', total === 0);
      badge.setAttribute('aria-label', total + ' notificações não lidas');
      link.setAttribute('aria-label', total > 0
        ? 'Central de notificações, ' + total + ' não lidas' : 'Central de notificações');
    }).catch(function () {
      // O contador será atualizado no próximo evento ou reconexão do EventSource.
    }).finally(function () { emConsulta = false; });
  }

  function conectarEventos() {
    if (!window.EventSource || fonte) return;
    fonte = new EventSource(endpointEventos, { withCredentials: true });
    fonte.addEventListener('conectado', atualizarContador);
    fonte.addEventListener('notificacao', atualizarContador);
    fonte.onerror = function () {
      // EventSource reconecta automaticamente; uma consulta única mantém o contador coerente.
      atualizarContador();
    };
  }

  function iniciar() {
    atualizarContador();
    conectarEventos();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) atualizarContador();
  });
  window.addEventListener('beforeunload', function () {
    if (fonte) fonte.close();
  });
})();
</script>
</body>
</html>
