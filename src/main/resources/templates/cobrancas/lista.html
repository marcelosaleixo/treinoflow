<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas cobranças | TreinoFlow</title><style>body{margin:0;background:#f3f6fb;color:#172554;font:14px Arial}.wrap{max-width:950px;margin:30px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #e2e8f0;white-space:nowrap}.muted{color:#64748b}.btn{display:inline-block;background:#2563eb;color:white;text-decoration:none;padding:10px 13px;border-radius:8px}.badge{padding:5px 8px;border-radius:99px;background:#e2e8f0}</style>  <link rel="stylesheet" th:href="@{/css/tf-header.css}" href="/css/tf-header.css">
</head><body>
<div th:replace="~{fragments/tf-header :: header}"></div>
<main class="wrap"><a class="btn" th:href="@{/dashboard}">← Voltar ao painel</a><h1>Minhas cobranças</h1><p class="muted">Histórico financeiro da sua assinatura.</p><section class="panel"><table><thead><tr><th>Competência</th><th>Plano</th><th>Valor</th><th>Vencimento</th><th>Pagamento</th><th>Status</th><th>Pagamento</th></tr></thead><tbody><tr th:each="c:${cobrancas}"><td th:text="${#temporals.format(c.competencia,'MM/yyyy')}"></td><td th:text="${c.assinatura.plano.nome}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(c.valor,1,2)}"></td><td th:text="${#temporals.format(c.dataVencimento,'dd/MM/yyyy')}"></td><td th:text="${c.dataPagamento != null ? #temporals.format(c.dataPagamento,'dd/MM/yyyy') : '-'}"></td><td><span class="badge" th:text="${c.status.descricao}"></span></td><td><a class="btn" th:if="${c.status.name() != 'PAGA' and c.status.name() != 'CANCELADA'}" th:href="@{/assinatura/cobrancas/{id}/pix(id=${c.id})}">Pagar / PIX</a></td></tr><tr th:if="${#lists.isEmpty(cobrancas)}"><td colspan="6">Nenhuma cobrança registrada.</td></tr></tbody></table></section><p th:if="${sucesso}" th:text="${sucesso}" style="color:#166534"></p><p th:if="${erro}" th:text="${erro}" style="color:#b91c1c"></p></main></body></html>
