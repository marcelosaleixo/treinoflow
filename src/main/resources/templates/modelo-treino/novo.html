<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo modelo | TreinoFlow</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172554;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:30px auto;padding:0 18px}.panel{background:#fff;border-radius:14px;padding:24px;box-shadow:0 8px 30px #17255410}.field{margin:14px 0}.field label{display:block;font-weight:bold;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.btn{display:inline-block;border:0;border-radius:8px;padding:11px 15px;background:#2563eb;color:#fff;text-decoration:none;font-weight:bold;cursor:pointer}.secondary{background:#e2e8f0;color:#172554}.muted{color:#64748b}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px}</style>  <link rel="stylesheet" th:href="@{/css/tf-header.css}" href="/css/tf-header.css">
</head><body>
<div th:replace="~{fragments/tf-header :: header}"></div>
<main class="wrap"><p><a th:href="@{/modelos-treino}">← Modelos</a></p><section class="panel"><h1>Novo modelo de treino</h1><p class="muted">Crie um modelo do zero e reutilize-o em qualquer aluno ativo.</p><div th:if="${erro}" class="error" th:text="${erro}"></div><form method="post" th:action="@{/modelos-treino/novo}" th:object="${modelo}"><div class="field"><label>Nome do modelo</label><input th:field="*{nome}" maxlength="80" required placeholder="Ex.: Hipertrofia feminina A"></div><div class="field"><label>Descrição</label><textarea th:field="*{descricao}" rows="4" maxlength="500" placeholder="Objetivo ou observações do modelo"></textarea></div><div class="actions"><button class="btn" type="submit">Criar e editar exercícios</button><a class="btn secondary" th:href="@{/modelos-treino}">Cancelar</a></div></form></section></main></body></html>
