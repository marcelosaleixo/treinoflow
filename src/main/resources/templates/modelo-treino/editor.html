<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor de modelo | TreinoFlow</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172554;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 8px 30px #17255410;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field label,label{display:block;font-weight:bold;font-size:14px;margin-bottom:6px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.btn{display:inline-block;border:0;border-radius:8px;padding:10px 13px;background:#2563eb;color:#fff;text-decoration:none;font-weight:bold;cursor:pointer}.secondary{background:#eaf1ff;color:#1d4ed8}.danger{background:#fee2e2;color:#991b1b}.muted{color:#64748b}.msg{padding:12px;border-radius:8px;margin:12px 0}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.exercise{border:1px solid #e2e8f0;border-radius:12px;padding:15px;margin:12px 0}.exercise-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions form{display:inline}.mini{padding:8px 10px}.empty{padding:20px;text-align:center;background:#f8fafc;border-radius:10px}.sticky{position:sticky;top:10px}@media(max-width:800px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid,.grid4{grid-template-columns:1fr}.exercise-head{align-items:flex-start;flex-direction:column}.sticky{position:static}}</style>  <link rel="stylesheet" th:href="@{/css/tf-header.css}" href="/css/tf-header.css">
</head><body>
<div th:replace="~{fragments/tf-header :: header}"></div>
<main class="wrap"><p><a th:href="@{/modelos-treino}">← Modelos</a></p><div th:if="${sucesso}" class="msg success" th:text="${sucesso}"></div><div th:if="${erro}" class="msg error" th:text="${erro}"></div><section class="panel"><div class="exercise-head"><div><h1 th:text="${modelo.nome}"></h1><p class="muted">Monte a prescrição uma vez e aplique depois a qualquer aluno.</p></div><div class="actions"><a class="btn secondary" th:href="@{/modelos-treino/{id}/aplicar(id=${modelo.id})}">Aplicar ao aluno</a><a class="btn secondary" th:href="@{/modelos-treino}">Voltar</a></div></div><form method="post" th:action="@{/modelos-treino/{id}/dados(id=${modelo.id})}"><div class="grid"><div><label>Nome</label><input name="nome" maxlength="80" required th:value="${modelo.nome}"></div><div><label>Descrição</label><textarea name="descricao" rows="2" maxlength="500" th:text="${modelo.descricao}"></textarea></div></div><p><button class="btn" type="submit">Salvar dados do modelo</button></p></form></section><section class="panel"><h2>Adicionar exercício</h2><form method="post" th:action="@{/modelos-treino/{id}/exercicios(id=${modelo.id})}"><div class="grid"><div><label>Exercício</label><select name="exercicioId" required><option value="">Selecione</option><option th:each="ex:${exercicios}" th:value="${ex.id}" th:text="${ex.nome + (ex.grupoMuscular != null ? ' — ' + ex.grupoMuscular : '')}"></option></select></div><div><label>Séries</label><input type="number" name="series" min="1" placeholder="Ex.: 3"></div><div><label>Repetições</label><input name="repeticoes" maxlength="30" placeholder="Ex.: 10–12"></div><div><label>Carga</label><input name="carga" maxlength="30" placeholder="Ex.: 20 kg"></div><div><label>Descanso (segundos)</label><input type="number" name="descansoSegundos" min="0" placeholder="Ex.: 60"></div><div><label>Observações</label><input name="observacao" maxlength="500" placeholder="Cadência, amplitude..." ></div></div><p><button class="btn" type="submit">+ Adicionar exercício</button></p></form></section><section class="panel"><h2>Exercícios do modelo</h2><div th:if="${itens.isEmpty()}" class="empty muted">Nenhum exercício ainda. Adicione o primeiro acima.</div><div class="exercise" th:each="item,stat:${itens}"><div class="exercise-head"><div><strong th:text="${item.ordem + '. ' + item.exercicio.nome}"></strong><div class="muted" th:text="${(item.series != null ? item.series : '—') + ' séries · ' + (item.repeticoes != null ? item.repeticoes : 'repetições não definidas') + ' · carga: ' + (item.carga != null ? item.carga : 'não definida') + ' · descanso: ' + (item.descansoSegundos != null ? item.descansoSegundos + 's' : '—')}"></div></div><div class="actions"><form method="post" th:action="@{/modelos-treino/{id}/exercicios/{itemId}/mover(id=${modelo.id},itemId=${item.id})}"><input type="hidden" name="direcao" value="-1"><button class="btn secondary mini" type="submit" th:disabled="${stat.first}">↑</button></form><form method="post" th:action="@{/modelos-treino/{id}/exercicios/{itemId}/mover(id=${modelo.id},itemId=${item.id})}"><input type="hidden" name="direcao" value="1"><button class="btn secondary mini" type="submit" th:disabled="${stat.last}">↓</button></form><form method="post" th:action="@{/modelos-treino/{id}/exercicios/{itemId}/excluir(id=${modelo.id},itemId=${item.id})}" onsubmit="return confirm('Remover este exercício do modelo?');"><button class="btn danger mini" type="submit">Remover</button></form></div></div><details><summary style="margin-top:12px;cursor:pointer;color:#1d4ed8;font-weight:bold">Editar prescrição</summary><form method="post" style="margin-top:12px" th:action="@{/modelos-treino/{id}/exercicios/{itemId}/atualizar(id=${modelo.id},itemId=${item.id})}"><div class="grid4"><div><label>Séries</label><input type="number" name="series" min="1" th:value="${item.series}"></div><div><label>Repetições</label><input name="repeticoes" maxlength="30" th:value="${item.repeticoes}"></div><div><label>Carga</label><input name="carga" maxlength="30" th:value="${item.carga}"></div><div><label>Descanso</label><input type="number" name="descansoSegundos" min="0" th:value="${item.descansoSegundos}"></div></div><label style="margin-top:10px">Observações</label><textarea name="observacao" rows="2" maxlength="500" th:text="${item.observacao}"></textarea><p><button class="btn" type="submit">Salvar prescrição</button></p></form></details></div></section></main></body></html>
