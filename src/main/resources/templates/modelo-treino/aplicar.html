<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aplicar modelo | TreinoFlow</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172554;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:28px auto;padding:0 18px}.panel{background:#fff;border-radius:14px;padding:22px;box-shadow:0 8px 30px #17255410;margin:16px 0}.field label{display:block;font-weight:bold;margin-bottom:6px}.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px}.exercise{padding:12px 0;border-bottom:1px solid #e2e8f0}.exercise:last-child{border:0}.muted{color:#64748b}.btn{display:inline-block;border:0;border-radius:8px;padding:11px 15px;background:#2563eb;color:#fff;text-decoration:none;font-weight:bold;cursor:pointer}.secondary{background:#e2e8f0;color:#172554}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}</style></head><body><main class="wrap"><p><a th:href="@{/modelos-treino}">← Modelos</a></p><section class="panel"><h1 th:text="${modelo.nome}"></h1><p class="muted" th:text="${modelo.descricao}"></p><h2>Exercícios</h2><div class="exercise" th:each="item:${itens}"><strong th:text="${item.ordem + '. ' + item.exercicio.nome}"></strong><div class="muted" th:text="${(item.series != null ? item.series : '—') + ' séries · ' + (item.repeticoes != null ? item.repeticoes : '—') + ' · carga: ' + (item.carga != null ? item.carga : '—') + ' · descanso: ' + (item.descansoSegundos != null ? item.descansoSegundos + 's' : '—')} "></div></div></section><section class="panel"><h2>Aplicar a um aluno</h2><form method="post" th:action="@{/modelos-treino/{id}/aplicar(id=${modelo.id})}"><div class="field"><label>Aluno</label><select name="alunoId" required><option value="">Selecione um aluno</option><option th:each="aluno:${alunos}" th:value="${aluno.id}" th:text="${aluno.nome}"></option></select></div><div class="actions"><button class="btn" type="submit">Aplicar modelo</button><a class="btn secondary" th:href="@{/modelos-treino}">Cancelar</a></div></form></section></main></body></html>
