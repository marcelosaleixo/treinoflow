<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercícios | TreinoFlow</title><link rel="stylesheet" th:href="@{/css/treinoflow.css}"><link rel="stylesheet" th:href="@{/css/paginacao.css}"></head><body><header class="bar"><strong>TreinoFlow</strong><a th:href="@{/alunos}">← Alunos</a></header><main class="wrap"><div class="head"><div><div class="eyebrow">Biblioteca</div><h1>Exercícios</h1><p>Exercícios próprios e globais disponíveis para montar seus treinos.</p></div><a class="btn" th:href="@{/exercicios/novo}">＋ Novo exercício</a></div><form class="list-search" method="get" th:action="@{/exercicios}">
<label for="exercicioBusca">Buscar exercício</label>
<div class="list-search-controls"><input id="exercicioBusca" type="search" name="q" th:value="${q}" placeholder="Nome do exercício"><input type="hidden" name="size" th:value="${pagina.size}"><button class="btn primary" type="submit">Buscar</button><a class="btn soft" th:href="@{/exercicios}">Limpar</a></div>
</form><section class="panel"><div class="panel-top" th:text="|${pagina.totalElements} exercícios disponíveis|">Biblioteca</div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Grupo muscular</th><th>Vídeo</th><th>Ações</th></tr></thead><tbody><tr th:each="e : ${pagina.content}"><td><strong th:text="${e.nome}"></strong></td><td th:text="${e.grupoMuscular ?: '-'}"></td><td><a class="btn soft" th:if="${e.urlVideo}" th:href="${e.urlVideo}" target="_blank" rel="noopener">Abrir vídeo</a><span th:unless="${e.urlVideo}">—</span></td><td><a class="btn soft" th:if="${e.personal != null}" th:href="@{/exercicios/{id}/editar(id=${e.id})}">Editar</a></td></tr></tbody></table></div><div th:replace="~{fragments/paginacao :: paginacao(pagina=${pagina}, caminho='/exercicios', q=${q}, status='')}"></div></section></main></body></html>
