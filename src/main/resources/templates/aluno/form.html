<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${titulo} + ' | TreinoFlow'">Aluno | TreinoFlow</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;color:#172554}.bar{background:#172554;color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:760px;margin:32px auto;padding:0 20px}.panel{background:white;padding:28px;border-radius:14px;box-shadow:0 8px 30px #17255410}label{display:block;font-weight:600;margin:14px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:110px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actions{display:flex;gap:10px;margin-top:24px}.btn{padding:11px 16px;border:0;border-radius:8px;text-decoration:none;cursor:pointer;font-weight:600}.primary{background:#2563eb;color:white}.secondary{background:#e2e8f0;color:#172554}.msg{padding:12px 14px;border-radius:8px;margin:14px 0}.msg.error{background:#fee2e2;color:#991b1b}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="bar"><strong>TreinoFlow</strong><a style="color:white" th:href="@{/alunos}">Voltar para alunos</a></header><main class="wrap"><section class="panel"><h1 th:text="${titulo}"></h1><div th:if="${erro}" class="msg error" role="alert" th:text="${erro}"></div><form th:action="@{/alunos/salvar}" th:object="${aluno}" method="post"><input type="hidden" th:field="*{id}">
<div class="grid"><div><label for="nome">Nome *</label><input id="nome" th:field="*{nome}" maxlength="120" required></div><div><label for="status">Status</label><select id="status" th:field="*{status}"><option value="ATIVO">Ativo</option><option value="INATIVO">Inativo</option></select></div></div>
<div class="grid"><div><label for="email">E-mail</label><input id="email" type="email" th:field="*{email}" maxlength="150"></div><div><label for="telefone">Telefone</label><input id="telefone" th:field="*{telefone}" maxlength="20"></div></div>
<div class="grid"><div><label for="objetivo">Objetivo</label><select id="objetivo" th:field="*{objetivo}">
<option value="">Selecione o objetivo</option>
<option th:if="${aluno.objetivo != null and !#lists.contains(objetivos, aluno.objetivo)}" th:value="${aluno.objetivo}" th:text="${aluno.objetivo}"></option>
<option th:each="opcao : ${objetivos}" th:value="${opcao}" th:text="${opcao}"></option>
</select></div><div><label for="dataInicio">Data de início</label><input id="dataInicio" type="date" th:field="*{dataInicio}"></div></div>
<label for="observacoes">Observações</label><textarea id="observacoes" th:field="*{observacoes}"></textarea><div class="actions"><a class="btn secondary" th:href="@{/alunos}">Cancelar</a><button class="btn primary" type="submit">Salvar aluno</button></div></form></section></main></body></html>
