<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${titulo} + ' | TreinoFlow'">Avaliação | TreinoFlow</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;color:#172554}.bar{background:#172554;color:#fff;padding:16px 5%}.wrap{max-width:850px;margin:28px auto;padding:0 18px}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 8px 25px #17255410}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:600;font-size:14px}.field small{color:#64748b;font-size:12px;line-height:1.4}.alert{padding:12px 14px;border-radius:8px;margin:12px 0;background:#fee2e2;color:#991b1b}.field input,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.wide{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:20px}.btn{border:0;border-radius:8px;padding:11px 16px;background:#2563eb;color:#fff;text-decoration:none;cursor:pointer;font-weight:bold}.secondary{background:#e2e8f0;color:#172554}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:17px}}
</style></head><body><header class="bar"><strong>TreinoFlow · Avaliação de <span th:text="${aluno.nome}"></span></strong></header><main class="wrap"><section class="card"><h1 th:text="${titulo}">Avaliação física</h1><div class="alert" th:if="${erro}" th:text="${erro}" role="alert"></div><form method="post" th:action="@{/alunos/{id}/avaliacoes/salvar(id=${aluno.id})}" th:object="${avaliacao}"><input type="hidden" th:field="*{id}"><div class="grid"><div class="field"><label for="dataAvaliacao">Data da avaliação *</label><input id="dataAvaliacao" type="date" th:field="*{dataAvaliacao}" required></div><div class="field"><label for="pesoKg">Peso (kg)</label><input id="pesoKg" type="number" step="0.01" min="0" th:field="*{pesoKg}"></div><div class="field"><label for="alturaMetros">Altura (cm ou m)</label><input id="alturaMetros" type="number" step="0.01" min="0" max="250" placeholder="Ex.: 160 ou 1,60" th:field="*{alturaMetros}"><small>Informe em centímetros (160) ou metros (1,60). O sistema salva em metros.</small></div><div class="field"><label for="percentualGordura">Gordura corporal (%)</label><input id="percentualGordura" type="number" step="0.01" min="0" max="100" th:field="*{percentualGordura}"></div><div class="field"><label for="cinturaCm">Cintura (cm)</label><input id="cinturaCm" type="number" step="0.01" min="0" th:field="*{cinturaCm}"></div><div class="field"><label for="quadrilCm">Quadril (cm)</label><input id="quadrilCm" type="number" step="0.01" min="0" th:field="*{quadrilCm}"></div><div class="field"><label for="toraxCm">Tórax (cm)</label><input id="toraxCm" type="number" step="0.01" min="0" th:field="*{toraxCm}"></div><div class="field"><label for="bracoCm">Braço (cm)</label><input id="bracoCm" type="number" step="0.01" min="0" th:field="*{bracoCm}"></div><div class="field"><label for="coxaCm">Coxa (cm)</label><input id="coxaCm" type="number" step="0.01" min="0" th:field="*{coxaCm}"></div><div class="field wide"><label for="observacoes">Observações</label><textarea id="observacoes" rows="4" th:field="*{observacoes}"></textarea></div></div><div class="actions"><button class="btn" type="submit">Salvar avaliação</button><a class="btn secondary" th:href="@{/alunos/{id}/avaliacoes(id=${aluno.id})}">Cancelar</a></div></form></section></main></body></html>
