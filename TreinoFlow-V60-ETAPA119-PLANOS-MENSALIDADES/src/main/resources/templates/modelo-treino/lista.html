<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modelos de treino | TreinoFlow</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172554;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:28px auto;padding:0 18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.panel{background:#fff;border-radius:14px;padding:20px;box-shadow:0 8px 30px #17255410;margin:16px 0}.filters{display:grid;grid-template-columns:1fr auto auto;gap:10px}.filters input{padding:11px;border:1px solid #cbd5e1;border-radius:8px}.btn{display:inline-block;border:0;border-radius:8px;padding:10px 13px;background:#2563eb;color:#fff;text-decoration:none;font-weight:bold;cursor:pointer}.secondary{background:#eaf1ff;color:#1d4ed8}.danger{background:#fee2e2;color:#991b1b}.msg{padding:12px;border-radius:8px;margin:12px 0}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.item{border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:10px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#64748b;font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:650px){.filters{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1;text-align:center}}</style></head><body><main class="wrap"><div class="head"><div><p><a th:href="@{/dashboard}">← Dashboard</a></p><h1>Modelos de treino</h1><p class="muted">Crie uma prescrição uma vez e aplique-a rapidamente a outros alunos.</p></div><div class="actions"><a class="btn" th:href="@{/modelos-treino/novo}">+ Novo modelo</a><a class="btn secondary" th:href="@{/alunos}">Ver alunos</a></div></div><div th:if="${sucesso}" class="msg success" th:text="${sucesso}"></div><div th:if="${erro}" class="msg error" th:text="${erro}"></div><section class="panel"><form class="filters" method="get"><input name="q" th:value="${q}" placeholder="Buscar modelo por nome"><button class="btn" type="submit">Buscar</button><a class="btn secondary" th:href="@{/modelos-treino}">Limpar</a></form></section><section class="panel"><p th:if="${pagina.empty}" class="muted">Você ainda não possui modelos. Abra um treino e use <strong>Salvar como modelo</strong>.</p><div class="item" th:each="modelo:${pagina.content}"><div><strong th:text="${modelo.nome}"></strong><div class="muted" th:text="${modelo.descricao != null and !modelo.descricao.isBlank() ? modelo.descricao : 'Sem descrição'}"></div></div><div class="actions"><a class="btn secondary" th:href="@{/modelos-treino/{id}/editar(id=${modelo.id})}">Editar</a><a class="btn" th:href="@{/modelos-treino/{id}/aplicar(id=${modelo.id})}">Aplicar</a><form method="post" th:action="@{/modelos-treino/{id}/excluir(id=${modelo.id})}" onsubmit="return confirm('Excluir este modelo?');"><button class="btn danger" type="submit">Excluir</button></form></div></div></section></main></body></html>
