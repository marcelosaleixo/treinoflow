<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planos | TreinoFlow</title><style>body{margin:0;background:#f1f5f9;font:14px Arial;color:#172554}.wrap{max-width:1050px;margin:30px auto;padding:0 16px}.panel{background:white;padding:20px;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}.btn{padding:10px 14px;background:#2563eb;color:white;border:0;border-radius:7px;text-decoration:none;cursor:pointer}.danger{background:#b91c1c}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:bold}.success{color:#166534}.error{color:#b91c1c}</style></head><body><div th:replace="~{admin/base-fragment :: topo('Planos e preços')}"></div><main class="wrap"><h1>Planos comerciais</h1><p class="success" th:if="${sucesso}" th:text="${sucesso}"></p><p class="error" th:if="${erro}" th:text="${erro}"></p><p><a class="btn" th:href="@{/admin/planos/novo}">+ Criar plano</a></p><section class="panel"><table><thead><tr><th>Plano</th><th>Mensalidade</th><th>Limite de alunos</th><th>Padrão</th><th>Status</th><th>Ação</th></tr></thead><tbody><tr th:each="pl:${planos}"><td><strong th:text="${pl.nome}"></strong><br><small th:text="${pl.descricao}"></small></td><td th:text="${'R$ ' + #numbers.formatDecimal(pl.valorMensal,1,2)}"></td><td th:text="${pl.limiteAlunos}"></td><td><span class="badge" th:if="${pl.padrao}">Plano padrão</span><span th:unless="${pl.padrao}">—</span></td><td th:text="${pl.ativo ? 'Ativo':'Inativo'}"></td><td><a th:href="@{/admin/planos/{id}/editar(id=${pl.id})}">Editar</a> &nbsp; <form style="display:inline" th:action="@{/admin/planos/{id}/status(id=${pl.id})}" method="post"><button class="btn" th:classappend="${pl.ativo ? ' danger':''}" th:text="${pl.ativo ? 'Desativar':'Ativar'}"></button></form></td></tr><tr th:if="${#lists.isEmpty(planos)}"><td colspan="6">Nenhum plano cadastrado.</td></tr></tbody></table></section></main></body></html>
