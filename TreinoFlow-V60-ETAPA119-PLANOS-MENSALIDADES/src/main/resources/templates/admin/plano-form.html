<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plano | TreinoFlow</title><style>body{margin:0;background:#f1f5f9;font:15px Arial;color:#172554}.wrap{max-width:680px;margin:30px auto;padding:0 16px}.panel{background:white;padding:24px;border-radius:12px}label{display:block;font-weight:bold;margin:14px 0 6px}input,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;box-sizing:border-box}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.btn{padding:11px 15px;background:#2563eb;color:white;border:0;border-radius:7px;margin-top:18px}.error{color:#b91c1c}</style></head><body><div th:replace="~{admin/base-fragment :: topo('Plano comercial')}"></div><main class="wrap"><section class="panel"><h1 th:text="${planoId != null ? 'Editar plano' : 'Criar plano'}">Criar plano</h1><p class="error" th:if="${erro}" th:text="${erro}"></p><form method="post" th:action="@{/admin/planos/salvar}" th:object="${form}"><input type="hidden" name="id" th:value="${planoId}"><label>Nome do plano</label><input th:field="*{nome}" required maxlength="80"><label>Descrição / benefícios</label><textarea th:field="*{descricao}" rows="3" maxlength="500"></textarea><label>Valor mensal (R$)</label><input th:field="*{valorMensal}" type="number" min="0" step="0.01" required><label>Limite de alunos</label><input th:field="*{limiteAlunos}" type="number" min="1" max="100000" required><label class="check"><input th:field="*{ativo}" type="checkbox"> Plano ativo</label><label class="check"><input th:field="*{padrao}" type="checkbox"> Usar como plano padrão para novos personais</label><button class="btn" type="submit">Salvar plano</button></form></section></main></body></html>
