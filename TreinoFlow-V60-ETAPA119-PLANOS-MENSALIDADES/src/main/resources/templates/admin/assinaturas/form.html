<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assinatura | TreinoFlow</title><style>body{margin:0;background:#f1f5f9;font:14px Arial;color:#172554}.wrap{max-width:760px;margin:30px auto;padding:0 16px}.panel{background:#fff;padding:24px;border-radius:12px;border:1px solid #e2e8f0}label{display:block;font-weight:bold;margin-top:14px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #cbd5e1;border-radius:7px}button{margin-top:20px;padding:11px 18px;border:0;border-radius:7px;background:#2563eb;color:#fff}</style></head><body><div th:replace="~{admin/base-fragment :: topo('Editar assinatura')}"></div><main class="wrap"><section class="panel"><h1>Gestão da assinatura</h1><form th:action="@{/admin/assinaturas/salvar}" method="post"><input type="hidden" name="id" th:value="${assinatura.id}"><label>Personal<select name="personalId" required><option th:each="p:${personais}" th:value="${p.id}" th:text="${p.nome+' · '+p.email}" th:selected="${assinatura.personal != null and assinatura.personal.id == p.id}"></option></select></label><label>Plano<select name="planoId" required><option th:each="p:${planos}" th:value="${p.id}" th:text="${p.nome+' · R$ '+p.valorMensal}" th:selected="${assinatura.plano != null and assinatura.plano.id == p.id}"></option></select></label><label>Status<select name="status" required><option th:each="s:${status}" th:value="${s}" th:text="${s.descricao}" th:selected="${assinatura.status == s}"></option></select></label><label>Data de início<input type="date" name="dataInicio" required th:value="${assinatura.dataInicio}"></label><label>Data de vencimento<input type="date" name="dataVencimento" th:value="${assinatura.dataVencimento}"></label><label>Próxima cobrança<input type="date" name="dataProximaCobranca" th:value="${assinatura.dataProximaCobranca}"></label><label>Data de cancelamento<input type="date" name="dataCancelamento" th:value="${assinatura.dataCancelamento}"></label><label>Observação<textarea name="observacao" rows="4" th:text="${assinatura.observacao}"></textarea></label><button type="submit">Salvar assinatura</button></form></section></main></body></html>
