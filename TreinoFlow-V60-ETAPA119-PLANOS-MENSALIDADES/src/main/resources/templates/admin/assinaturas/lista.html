<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assinaturas | TreinoFlow</title><style>body{margin:0;background:#f1f5f9;font:14px Arial;color:#172554}.wrap{max-width:1150px;margin:30px auto;padding:0 16px}.panel{background:#fff;padding:20px;border:1px solid #e2e8f0;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0;white-space:nowrap}.ok{color:#166534}.warn{color:#92400e}.bad{color:#b91c1c}.btn{display:inline-block;padding:9px 13px;background:#2563eb;color:white;border-radius:7px;text-decoration:none}</style></head><body><div th:replace="~{admin/base-fragment :: topo('Gestão de assinaturas')}"></div><main class="wrap"><h1>Assinaturas e status do plano</h1><p class="ok" th:if="${sucesso}" th:text="${sucesso}"></p><section class="panel"><table><thead><tr><th>Personal</th><th>Plano</th><th>Status</th><th>Início</th><th>Vencimento</th><th>Próxima cobrança</th><th>Ação</th></tr></thead><tbody><tr th:each="a:${assinaturas}"><td th:text="${a.personal.nome}"></td><td th:text="${a.plano.nome}"></td><td th:text="${a.status.descricao}"></td><td th:text="${#temporals.format(a.dataInicio,'dd/MM/yyyy')}"></td><td th:text="${a.dataVencimento != null ? #temporals.format(a.dataVencimento,'dd/MM/yyyy') : 'Sem vencimento'}"></td><td th:text="${a.dataProximaCobranca != null ? #temporals.format(a.dataProximaCobranca,'dd/MM/yyyy') : '-'}"></td><td><a th:href="@{/admin/assinaturas/{id}/editar(id=${a.id})}">Editar</a></td></tr><tr th:if="${#lists.isEmpty(assinaturas)}"><td colspan="7">Nenhuma assinatura cadastrada.</td></tr></tbody></table></section></main></body></html>
