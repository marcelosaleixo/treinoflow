<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${titulo + ' | TreinoFlow'}">Agendamento | TreinoFlow</title>
<style>:root{--navy:#172554;--blue:#2563eb;--muted:#64748b;--line:#cbd5e1;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--navy)}.top{background:var(--navy);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;background:#ffffff14;padding:9px 12px;border-radius:8px}.wrap{max-width:760px;margin:35px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:24px;box-shadow:0 8px 26px #17255408}.eyebrow{font-size:12px;color:var(--blue);font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{margin:7px 0 22px}form{display:grid;gap:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:750;color:#334155}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:inherit;background:#fff;color:#172554}.field textarea{min-height:110px;resize:vertical}.help{font-size:11px;color:var(--muted)}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:5px}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:#fff;text-decoration:none;font-weight:750;cursor:pointer}.secondary{background:#eaf2ff;color:#1d4ed8}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:18px}.actions{flex-direction:column-reverse}.btn{text-align:center}}
</style><link rel="stylesheet" th:href="@{/css/tf-header.css}"></head>
<body><div th:replace="~{fragments/tf-header :: header}"></div><main class="wrap"><section class="card"><div class="eyebrow">Agenda</div><h1 th:text="${titulo}">Novo agendamento</h1>
<form th:action="@{/agenda/salvar}" th:object="${agendamento}" method="post"><input type="hidden" th:field="*{id}">
<div class="field"><label>Aluno</label><select th:field="*{aluno.id}" required><option value="">Selecione um aluno</option><option th:each="aluno : ${alunos}" th:value="${aluno.id}" th:text="${aluno.nome}">Aluno</option></select></div>
<div class="grid"><div class="field"><label>Início</label><input type="datetime-local" th:field="*{inicio}" required></div><div class="field"><label>Fim</label><input type="datetime-local" th:field="*{fim}" required></div></div>
<div class="grid"><div class="field"><label>Tipo</label><select th:field="*{tipo}"><option th:each="tipo : ${tiposDisponiveis}" th:value="${tipo}" th:text="${tipo}">TREINO</option></select></div><div class="field"><label>Status</label><select th:field="*{status}"><option th:each="status : ${statusDisponiveis}" th:value="${status}" th:text="${status}">AGENDADO</option></select></div></div>
<div class="field"><label>Observações</label><textarea th:field="*{observacoes}" maxlength="2000" placeholder="Ex.: avaliação inicial, foco em membros inferiores..."></textarea><span class="help">O sistema bloqueia horários sobrepostos para o mesmo Personal.</span></div>
<div class="actions"><a class="btn secondary" th:href="@{/agenda}">Cancelar</a><button class="btn" type="submit">Salvar agendamento</button></div>
</form></section></main></body></html>
