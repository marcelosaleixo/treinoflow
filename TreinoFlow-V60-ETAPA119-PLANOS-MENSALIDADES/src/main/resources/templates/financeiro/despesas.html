<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Despesas | TreinoFlow</title><style>body{font-family:Arial,sans-serif;background:#f3f6fb;color:#142b55;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #dce4f0;border-radius:16px;padding:20px;margin:16px 0}form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}input,select,textarea,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:8px;width:100%;box-sizing:border-box}button,.btn{background:#2563eb;color:white;border:0;cursor:pointer;text-decoration:none;padding:11px 14px;border-radius:8px;display:inline-block}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}.msg{padding:10px;background:#dcfce7;border-radius:8px}.err{padding:10px;background:#fee2e2;border-radius:8px}.scroll{overflow-x:auto}@media(max-width:600px){body{padding:12px}}</style>  <link rel="stylesheet" th:href="@{/css/tf-header.css}" href="/css/tf-header.css">
</head><body>
<div th:replace="~{fragments/tf-header :: header}"></div>
<main class="wrap"><a href="/financeiro" class="btn">← Financeiro</a> <a href="/financeiro/dre" class="btn">DRE simplificada</a><h1>Despesas do Personal</h1><p>Registre custos do seu negócio e acompanhe o que já foi pago ou ainda está pendente.</p><p th:if="${sucesso}" class="msg" th:text="${sucesso}"></p><p th:if="${erro}" class="err" th:text="${erro}"></p><section class="card"><h2>Nova despesa</h2><form class="grid" method="post" action="/financeiro/despesas"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Descrição<input name="descricao" maxlength="140" required placeholder="Ex.: aluguel da sala"></label><label>Categoria<input name="categoria" maxlength="60" required placeholder="Ex.: aluguel, equipamento"></label><label>Valor (R$)<input name="valor" type="number" min="0.01" step="0.01" required></label><label>Data<input name="dataDespesa" type="date" required th:value="${hoje}"></label><label>Status<select name="paga"><option value="true">Paga</option><option value="false">Pendente</option></select></label><label>Observação<input name="observacao" maxlength="500"></label><button type="submit">Registrar despesa</button></form></section><section class="card"><h2>Resumo do mês</h2> <a class="btn" th:href="@{/financeiro/despesas/exportar(ano=${periodo.year},mes=${periodo.monthValue})}">Exportar CSV</a><p>Pagas: <strong th:text="${#numbers.formatCurrency(totalPago)}"></strong></p><p>Pendentes: <strong th:text="${#numbers.formatCurrency(totalPendente)}"></strong></p><form method="get" action="/financeiro/despesas" class="grid"><label>Ano<input type="number" name="ano" min="2000" max="2200" th:value="${periodo.year}"></label><label>Mês<input type="number" name="mes" min="1" max="12" th:value="${periodo.monthValue}"></label><button type="submit">Filtrar</button></form></section><section class="card"><h2>Despesas do período</h2><div class="scroll"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Status</th><th>Ação</th></tr></thead><tbody><tr th:each="d : ${despesas}"><td th:text="${#temporals.format(d.dataDespesa,'dd/MM/yyyy')}"></td><td th:text="${d.descricao}"></td><td th:text="${d.categoria}"></td><td th:text="${#numbers.formatCurrency(d.valor)}"></td><td th:text="${d.paga ? 'Paga' : 'Pendente'}"></td><td><form method="post" th:action="@{/financeiro/despesas/{id}/excluir(id=${d.id})}" onsubmit="return confirm('Excluir esta despesa?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Excluir</button></form></td></tr><tr th:if="${#lists.isEmpty(despesas)}"><td colspan="6">Nenhuma despesa neste período.</td></tr></tbody></table></div></section></main></body></html>
