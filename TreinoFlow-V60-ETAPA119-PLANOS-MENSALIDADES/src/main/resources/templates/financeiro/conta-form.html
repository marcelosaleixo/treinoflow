<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova conta a receber | TreinoFlow</title>
  <link rel="stylesheet" th:href="@{/css/treinoflow.css}"><link rel="stylesheet" th:href="@{/css/tf-header.css}"><link rel="stylesheet" th:href="@{/css/tf-pages.css}">
  <style>
    :root{--navy:#172554;--blue:#2563eb;--muted:#64748b;--line:#e2e8f0;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,Arial,sans-serif}main{max-width:760px;margin:34px auto;padding:0 22px}.eyebrow{color:var(--blue);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}h1{font-size:30px;margin:8px 0}.intro{color:var(--muted);margin:0 0 22px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:750}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:inherit;color:var(--navy);background:#fff}textarea{min-height:100px;resize:vertical}.hint{font-size:12px;color:var(--muted)}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:750;cursor:pointer;text-decoration:none;background:var(--blue);color:#fff}.btn.secondary{background:#eff6ff;color:#1d4ed8}@media(max-width:600px){main{padding:0 16px;margin:24px auto}.card{padding:18px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions{flex-direction:column}.actions .btn{width:100%;text-align:center}}
  </style>
</head>
<body>
<div th:replace="~{fragments/tf-header :: header}"></div>
<main><div class="eyebrow">Financeiro</div><h1>Nova conta a receber</h1><p class="intro">Registre uma receita que seu aluno ainda precisa pagar.</p>
<section class="card"><form th:action="@{/financeiro/contas-receber}" method="post"><div class="grid">
  <div class="field full"><label for="alunoId">Aluno</label><select id="alunoId" name="alunoId"><option value="">Sem aluno vinculado</option><option th:each="a : ${alunos}" th:value="${a.id}" th:text="${a.nome}"></option></select><span class="hint">Vincular ao aluno facilita a evolução financeira dele nas próximas etapas.</span></div>
  <div class="field full"><label for="descricao">Descrição *</label><input id="descricao" name="descricao" maxlength="160" required placeholder="Ex.: Mensalidade outubro"></div>
  <div class="field"><label for="valor">Valor *</label><input id="valor" name="valor" type="number" min="0.01" step="0.01" required placeholder="300,00"></div>
  <div class="field"><label for="dataVencimento">Vencimento *</label><input id="dataVencimento" name="dataVencimento" type="date" th:min="${hoje}" required></div>
  <div class="field full"><label for="observacao">Observação</label><textarea id="observacao" name="observacao" maxlength="500" placeholder="Informações adicionais sobre esta cobrança"></textarea></div>
</div><div class="actions"><a class="btn secondary" th:href="@{/financeiro}">Cancelar</a><button class="btn" type="submit">Cadastrar conta</button></div></form></section></main>
</body></html>
